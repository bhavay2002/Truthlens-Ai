services:
  - type: web
    name: truthlens-ai
    runtime: python
    buildCommand: pip install 'torch>=2.1,<3.0' --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: gunicorn api.main:app --bind 0.0.0.0:$PORT --worker-class uvicorn.workers.UvicornWorker --workers 1 --timeout 120
    envVars:
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health
