# ==========================================================
# MODEL
# ==========================================================

model:

  encoder:
    name: roberta-base
    tokenizer_name: roberta-base
    max_length: 512
    cache_dir: models/cache

    # memory optimization
    gradient_checkpointing: false

    # execution optimization
    flash_attention: true

    # compilation
    torch_compile: true
    compile_mode: max-autotune

  architecture:
    type: multitask_transformer
    shared_encoder: true     # avoid repeated encoder calls
    dropout: 0.1

    # memory efficiency
    reduce_intermediate_allocation: true

  path: models/truthlens_model


# ==========================================================
# TRAINING
# ==========================================================

training:

  seed: 42
  device: auto

  epochs: 4

  batch_size: 48

  # throughput scaling
  gradient_accumulation_steps: 1

  learning_rate: 4e-5
  weight_decay: 0.01
  warmup_ratio: 0.1

  scheduler: cosine
  optimizer: adamw

  # mixed precision
  amp:
    enabled: true
    dtype: bf16   # better than fp16 on modern GPUs

  gradient_clipping: 1.0

  # ------------------------------------------------------
  # DATA PIPELINE OPTIMIZATION
  # ------------------------------------------------------

  dynamic_padding: true
  group_by_length: true

  dataloader:
    num_workers: 12
    persistent_workers: true
    prefetch_factor: 4
    pin_memory: true   # critical

  # ------------------------------------------------------
  # EXECUTION OPTIMIZATION
  # ------------------------------------------------------

  torch_compile: true
  compile_mode: max-autotune

  fused_attention: true

  # ------------------------------------------------------
  # CHECKPOINT OPTIMIZATION
  # ------------------------------------------------------

  checkpoint:
    save_steps: 1000
    save_total_limit: 3

    async_save: true               # non-blocking
    save_optimizer_every: 3000     # avoid every step

  resume_from_checkpoint: false

  text_column: text
  title_column: title

  early_stopping:
    enabled: true
    patience: 2
    metric: eval_f1


# ==========================================================
# DATA
# ==========================================================

data:

  train_path: data/splits/train.csv
  validation_path: data/splits/validation.csv
  test_path: data/splits/test.csv

  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed

  augmentation_multiplier: 1.5


# ==========================================================
# FEATURES
# ==========================================================

features:

  engineered_text_column: engineered_text

  tfidf:
    enabled: true
    max_features: 5000
    top_terms_per_doc: 4


# ==========================================================
# CROSS VALIDATION
# ==========================================================

cross_validation:

  enabled: false
  splits: 5
  metric: eval_loss


# ==========================================================
# HYPERPARAMETER TUNING
# ==========================================================

hyperparameter_tuning:

  enabled: false

  trials: 10
  direction: minimize
  metric: eval_loss

  search_space:

    learning_rate:
      min: 1e-6
      max: 5e-5

    batch_size:
      - 16
      - 32
      - 64

    epochs:
      - 3
      - 4


# ==========================================================
# EVALUATION
# ==========================================================

evaluation:

  metrics:

    classification:
      - accuracy
      - precision
      - recall
      - f1

    multi_label:
      - micro_f1
      - macro_f1
      - roc_auc


# ==========================================================
# LOGGING
# ==========================================================

logging:

  log_level: INFO

  training_log_path: logs/training.log

  eval_steps: 500


# ==========================================================
# PATHS
# ==========================================================

paths:

  models_dir: models
  logs_dir: logs
  reports_dir: reports

  tfidf_vectorizer_path: models/tfidf_vectorizer.joblib

  evaluation_results_path: reports/evaluation_results.json
  confusion_matrix_path: reports/confusion_matrix.png
  cleaning_report_path: reports/data_cleaning_report.json


# ==========================================================
# API
# ==========================================================

api:

  title: TruthLens AI API
  description: Multi-task NLP system
  version: 2.0.0

  text_preview_chars: 100


# ==========================================================
# INFERENCE
# ==========================================================

inference:

  batch_size: 32
  device: auto

  use_half_precision: true
  allow_raw_text_fallback: true