# ==========================================================
# TruthLens AI - Model & Training Configuration
# ==========================================================

model:

  encoder:
    name: roberta-base
    tokenizer_name: roberta-base
    max_length: 512
    cache_dir: models/cache

  architecture:
    type: multitask_transformer
    shared_encoder: true
    dropout: 0.1

  heads:

    bias_detection:
      num_labels: 3
      loss: cross_entropy
      label_column: bias_label

    ideology_detection:
      num_labels: 3
      loss: cross_entropy
      label_column: ideology_label

    propaganda_detection:
      num_labels: 2
      loss: cross_entropy
      label_column: propaganda_label

    emotion_detection:
      num_labels: 20
      type: multi_label
      loss: binary_cross_entropy
      label_prefix: emotion_

    narrative_roles:
      hero: hero
      villain: villain
      victim: victim
      loss: binary_cross_entropy

    frame_detection:
      labels:
        - RE
        - HI
        - CO
        - MO
        - EC
      loss: binary_cross_entropy

  path: models/truthlens_model

# ==========================================================
# TRAINING
# ==========================================================

training:

  seed: 42
  device: auto

  epochs: 4
  batch_size: 8
  gradient_accumulation_steps: 2

  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1

  scheduler: linear
  optimizer: adamw

  fp16: true
  gradient_clipping: 1.0

  resume_from_checkpoint: false

  text_column: text
  title_column: title

  early_stopping:
    enabled: true
    patience: 2
    metric: eval_f1

# ==========================================================
# DATA
# ==========================================================

data:

  train_path: data/splits/train.csv
  validation_path: data/splits/validation.csv
  test_path: data/splits/test.csv

  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed

  augmentation_multiplier: 2

# ==========================================================
# FEATURES
# ==========================================================

features:

  engineered_text_column: engineered_text

  tfidf:

    enabled: true
    max_features: 5000
    top_terms_per_doc: 4

# ==========================================================
# CROSS VALIDATION
# ==========================================================

cross_validation:

  enabled: false
  splits: 5
  metric: eval_loss

# ==========================================================
# HYPERPARAMETER TUNING
# ==========================================================

hyperparameter_tuning:

  enabled: false

  trials: 10
  direction: minimize
  metric: eval_loss

  search_space:

    learning_rate:
      min: 1e-6
      max: 5e-5

    batch_size:
      - 8
      - 16

    epochs:
      - 3
      - 4

# ==========================================================
# EVALUATION
# ==========================================================

evaluation:

  metrics:

    classification:
      - accuracy
      - precision
      - recall
      - f1

    multi_label:
      - micro_f1
      - macro_f1
      - roc_auc

# ==========================================================
# LOGGING
# ==========================================================

logging:

  log_level: INFO

  training_log_path: logs/training.log

  save_steps: 500
  eval_steps: 500

  save_total_limit: 3

# ==========================================================
# PATHS
# ==========================================================

paths:

  models_dir: models
  logs_dir: logs
  reports_dir: reports

  tfidf_vectorizer_path: models/tfidf_vectorizer.joblib

  evaluation_results_path: reports/evaluation_results.json
  confusion_matrix_path: reports/confusion_matrix.png
  cleaning_report_path: reports/data_cleaning_report.json

# ==========================================================
# API CONFIGURATION
# ==========================================================

api:

  title: TruthLens AI API
  description: Multi-task NLP system for bias, ideology, propaganda,
               emotion, and narrative analysis
  version: 2.0.0

  text_preview_chars: 100

# ==========================================================
# INFERENCE
# ==========================================================

inference:

  batch_size: 16
  device: auto

  allow_raw_text_fallback: true

  return_outputs:

    bias: true
    ideology: true
    propaganda: true
    emotion: true
    narrative_roles: true
    frames: true