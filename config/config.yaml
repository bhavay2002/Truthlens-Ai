#config\config.yaml

# =========================================================
# GLOBAL
# =========================================================

project:
  name: "TruthLens"
  seed: 42

# =========================================================
# TRAINING
# =========================================================

training:
  epochs: 4
  log_every: 50
  eval_every: 1
  checkpoint_every: 500
  gradient_accumulation_steps: 2
  early_stopping_patience: 5

# =========================================================
# OPTIMIZATION
# =========================================================

optimizer:
  name: "adamw"
  lr: 3e-5
  weight_decay: 0.01

scheduler:
  name: "linear"
  step_mode: "step"   # step | epoch | metric
  warmup_steps: 1000

# =========================================================
# MIXED PRECISION
# =========================================================

precision:
  use_amp: true
  amp_dtype: "bf16"   # bf16 | fp16
  allow_tf32: true

# =========================================================
# MODEL
# =========================================================

model:
  encoder: "roberta-base"
  hidden_dim: 768
  dropout: 0.1

# =========================================================
# TASK CONFIG (CRITICAL)
# =========================================================

tasks:
  bias: "multiclass"
  ideology: "multiclass"
  propaganda: "multiclass"
  narrative: "multilabel"
  narrative_frame: "multilabel"
  emotion: "multilabel"

task_weights:
  bias: 1.0
  ideology: 1.0
  propaganda: 1.0
  narrative: 1.0
  narrative_frame: 1.0
  emotion: 1.0

# =========================================================
# LOSS
# =========================================================

loss:
  ignore_index: -100
  validate_loss: true

# =========================================================
# DATALOADER
# =========================================================

data:
  batch_size: 16
  num_workers: 4
  pin_memory: true
  shuffle: true

# =========================================================
# DISTRIBUTED (DDP)
# =========================================================

distributed:
  use_ddp: true
  backend: "nccl"
  find_unused_parameters: false

# =========================================================
# MONITORING
# =========================================================

monitoring:
  spike_threshold: 3.0
  ema_alpha: 0.1
  health_threshold: 0.3
  grad_monitor_interval: 200

# =========================================================
# CHECKPOINTING
# =========================================================

checkpoint:
  dir: "checkpoints/"
  max_checkpoints: 3
  monitor_metric: "val_loss"
  mode: "min"

# =========================================================
# EVALUATION
# =========================================================

evaluation:
  device: null   # auto

# =========================================================
# EXPERIMENT TRACKING
# =========================================================

tracking:
  backend: "wandb"   # none | mlflow | wandb
  project_name: "truthlens"
  run_name: null
  tags:
    stage: "experiment"
    version: "v1"